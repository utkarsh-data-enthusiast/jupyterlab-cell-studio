[build-system]
requires = ["hatchling>=1.25", "hatch-jupyter-builder>=0.9.1", "jupyter-builder>=1.0.0"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-cell-studio"
version = "0.1.0"
description = "Privacy-first debugging and per-cell notebook actions for JupyterLab"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "PatriotEver Lab contributors" }]
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "Framework :: Jupyter :: JupyterLab :: Extensions",
  "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["jupyterlab>=4.5,<5"]

[project.urls]
Homepage = "https://github.com/utkarsh-data-enthusiast/jupyterlab-cell-studio"
Source = "https://github.com/utkarsh-data-enthusiast/jupyterlab-cell-studio"
Issues = "https://github.com/utkarsh-data-enthusiast/jupyterlab-cell-studio/issues"

[tool.hatch.build]
artifacts = ["jupyterlab_cell_studio/labextension"]

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_cell_studio"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_cell_studio/install.json" = "share/jupyter/labextensions/@patriotever/jupyterlab-cell-studio/install.json"
"jupyterlab_cell_studio/labextension" = "share/jupyter/labextensions/@patriotever/jupyterlab-cell-studio"

[tool.hatch.build.targets.sdist]
include = ["src", "style", "schema", "jupyterlab_cell_studio", "package.json", "package-lock.json", "tsconfig.json", "pyproject.toml", "README.md", "LICENSE", "SECURITY.md", "PRIVACY.md", "CHANGELOG.md", "tests", "docs", "examples"]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9.1"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["jupyterlab_cell_studio/labextension/package.json"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build"
npm = ["npm"]
